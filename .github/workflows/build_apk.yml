name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Scaffolding & Enable Desugaring
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          fi
          rm -rf android
          flutter create --platforms=android --org=com.bcycle .
          if [ -f /tmp/AndroidManifest.xml ]; then
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/package="com.bcycle.app"//g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          python3 - << 'EOF'
          import glob, re
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r", encoding="utf-8") as f:
                  c = f.read()
              if path.endswith(".kts"):
                  c = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 21", c)
                  c = re.sub(r"minSdkVersion\s*=\s*flutter\.minSdkVersion", "minSdkVersion = 21", c)
                  if "isCoreLibraryDesugaringEnabled" not in c:
                      c = c.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  if "desugar_jdk_libs" not in c:
                      c += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              else:
                  c = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdkVersion = 21", c)
                  if "coreLibraryDesugaringEnabled" not in c:
                      c = c.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  if "desugar_jdk_libs" not in c:
                      c += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
              with open(path, "w", encoding="utf-8") as f:
                  f.write(c)
              print("Patched:", path)
          EOF

      - name: Update Notification Package
        run: |
          flutter pub remove audioplayers || true
          flutter pub remove hive_generator || true
          flutter pub remove riverpod_generator || true
          flutter pub add flutter_local_notifications:^17.2.1

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BCycle-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
