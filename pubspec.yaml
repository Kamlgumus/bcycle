name: bcycle
description: BCycle - Bisiklet & Müzik Arkadaş Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animasyon
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0

  # Navigasyon
  go_router: ^12.1.1
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Yerel Depolama
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Müzik Oynatma (Çevrimdışı)
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.18

  # Sensörler & Sağlık
  sensors_plus: ^4.0.2
  pedometer: ^4.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Bluetooth / Akıllı Saat
  flutter_blue_plus: ^1.31.4

  # Bildirimler
  flutter_local_notifications: ^16.3.0
  
  # Harita
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Yardımcı
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/music/
    - assets/animations/
